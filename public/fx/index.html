<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>도트 이펙트 작업대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Silkscreen&display=swap">
<style>
/* Layout: 상단 설정 바 + 왼쪽 넓은 노드 캔버스 + 오른쪽 미리보기·속성 패널 (좁은 화면에서는 위아래로 쌓임) */
:root{
  --bg:#e8eaf0; --panel:#f6f7fa; --raised:#ffffff; --line:#d2d6e0; --fg:#1a1e29; --muted:#5d6577;
  --accent:#b4540a; --accent-fg:#ffffff; --grid:#cfd4de; --node:#ffffff; --sel:#b4540a;
  --gen:#b4540a; --mod:#2a64a3; --col:#a42f6c; --mix:#277a4c; --danger:#c0392b; --wire:#8b93a6;
  --chk-a:#24262e; --chk-b:#2c2f38; --stage-dark:#101116; --stage-light:#f2f2ee;
  --shadow:0 1px 2px rgba(20,24,36,.08),0 4px 14px rgba(20,24,36,.06);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-pix:"Silkscreen","JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141b; --panel:#191c25; --raised:#20242f; --line:#2d3241; --fg:#e4e7ee; --muted:#8c93a6;
  --accent:#f0a14a; --accent-fg:#1c1206; --grid:#232836; --node:#1d2029; --sel:#f0a14a;
  --gen:#f0a14a; --mod:#6ea9ea; --col:#e57cb5; --mix:#5cc28a; --danger:#ec6a5c; --wire:#6b7388;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12141b; --panel:#191c25; --raised:#20242f; --line:#2d3241; --fg:#e4e7ee; --muted:#8c93a6;
  --accent:#f0a14a; --accent-fg:#1c1206; --grid:#232836; --node:#1d2029; --sel:#f0a14a;
  --gen:#f0a14a; --mod:#6ea9ea; --col:#e57cb5; --mix:#5cc28a; --danger:#ec6a5c; --wire:#6b7388;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:12px 16px}

/* 상단 바 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:9px;margin-right:6px;color:inherit;text-decoration:none;border-radius:6px}
.brand:hover small{color:var(--accent)}
.brand svg{width:22px;height:22px;display:block}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand small{font:10px var(--f-pix);color:var(--muted);letter-spacing:.06em}
.fields{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fld{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.inp,.sel{height:30px;border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:0 8px;min-width:0}
.inp.num{width:64px;font-family:var(--f-num);font-size:12px}
#name{width:160px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.btn{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--line);background:var(--raised);border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn svg{width:14px;height:14px;fill:currentColor}

/* 작업 영역 */
.work{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:12px;min-height:0}
#graph{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background-color:var(--bg);
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:20px 20px;touch-action:none;cursor:default;min-height:0}
#graph.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--wire);stroke-width:2}
.wire.w-gen{stroke:var(--gen)}.wire.w-mod{stroke:var(--mod)}.wire.w-col{stroke:var(--col)}.wire.w-mix{stroke:var(--mix)}
.wire.tmp{stroke:var(--accent);stroke-dasharray:5 4}
.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.link:hover .wire{stroke:var(--danger);stroke-dasharray:4 3}

.node{position:absolute;width:184px;background:var(--node);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.node.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel),var(--shadow)}
.nhead{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);cursor:grab}
.ntitle{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nid{font:10px var(--f-num);color:var(--muted)}
.ncat{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;letter-spacing:.02em}
.c-gen{color:var(--gen);background:color-mix(in srgb,var(--gen) 14%,transparent)}
.c-mod{color:var(--mod);background:color-mix(in srgb,var(--mod) 14%,transparent)}
.c-col{color:var(--col);background:color-mix(in srgb,var(--col) 14%,transparent)}
.c-mix{color:var(--mix);background:color-mix(in srgb,var(--mix) 14%,transparent)}
.nthumb{display:block;width:84px;height:84px;margin:9px auto 4px;image-rendering:pixelated;border-radius:4px;
  background-color:var(--chk-a);background-image:conic-gradient(var(--chk-b) 25%,transparent 0 50%,var(--chk-b) 0 75%,transparent 0);background-size:12px 12px}
.nports{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 0 9px}
.ins{display:flex;flex-direction:column;gap:3px}
.port{display:flex;align-items:center;gap:6px;height:20px;font-size:11px;color:var(--muted)}
.port i{display:block;width:12px;height:12px;border-radius:50%;background:var(--node);border:2px solid var(--wire);cursor:crosshair;flex:none}
.port.in i{margin-left:-7px}.port.out i{margin-right:-7px}
.port.on i{background:var(--wire)}
.port i:hover{border-color:var(--accent);background:var(--accent)}
.node.drop .port.in i{border-color:var(--accent)}

.gtools{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:5;flex-wrap:wrap}
.ghint{position:absolute;left:12px;bottom:10px;right:12px;font-size:11.5px;color:var(--muted);pointer-events:none;z-index:4}
.menu{position:absolute;z-index:20;width:236px;max-height:calc(100% - 20px);overflow:auto;background:var(--raised);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px}
.menu h4{margin:8px 8px 4px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.menu button{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.menu button .dot{width:8px;height:8px;border-radius:2px;margin-top:6px;grid-row:span 2}
.menu button b{font-weight:500}
.menu button small{color:var(--muted);font-size:11px;line-height:1.35}

/* 오른쪽 패널 */
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-h h2{margin:0;font-size:12.5px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--raised);padding:3px 8px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.stage{display:grid;place-items:center;border-radius:8px;min-height:220px;padding:8px;overflow:hidden}
.stage canvas{image-rendering:pixelated;display:block;max-width:100%}
.bg-checker{background-color:var(--chk-a);background-image:conic-gradient(var(--chk-b) 25%,transparent 0 50%,var(--chk-b) 0 75%,transparent 0);background-size:16px 16px}
.bg-dark{background:var(--stage-dark)}
.bg-light{background:var(--stage-light)}
.transport{display:flex;align-items:center;gap:6px}
.transport input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.fcount{font:11px var(--f-pix);color:var(--muted);min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.strip-wrap{position:relative;overflow-x:auto;border-radius:6px;background:var(--stage-dark)}
.strip-in{position:relative;width:max-content}
#strip{display:block;height:44px;image-rendering:pixelated;cursor:pointer}
#stripCur{position:absolute;top:0;bottom:0;border:2px solid var(--accent);border-radius:3px;pointer-events:none}
.meta{font-size:11.5px;color:var(--muted)}

.cv-wrap{position:relative;line-height:0}
#pivotMark{position:absolute;width:11px;height:11px;margin:-5px 0 0 -5px;pointer-events:none;
  background:linear-gradient(var(--accent),var(--accent)) center/100% 1px no-repeat,linear-gradient(var(--accent),var(--accent)) center/1px 100% no-repeat}
.pivot-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pivot-row .inp.num{width:58px;height:26px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;align-items:baseline}
.rules li small{grid-column:2;color:var(--muted);font-size:11.5px}
.pill{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--mix);background:color-mix(in srgb,var(--mix) 15%,transparent)}
.pill.warn{color:var(--gen);background:color-mix(in srgb,var(--gen) 16%,transparent)}
.pill.bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 15%,transparent)}
.palpick{width:100%;height:28px;border:1px solid var(--line);background:var(--raised);border-radius:5px;padding:0 6px;margin-bottom:6px}
.palrow{display:flex;gap:0;height:10px;border-radius:3px;overflow:hidden;margin-top:4px}
.palrow span{flex:1}
#insp .empty{color:var(--muted);font-size:12.5px;line-height:1.6}
#insp .empty kbd{font:11px var(--f-num);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--raised)}
.ihead{display:flex;align-items:center;gap:8px}
.ihead b{font-size:14px}
.ihead code{font:11px var(--f-num);color:var(--muted);margin-left:auto}
.idesc{margin:0;color:var(--muted);font-size:12px}
.prms{display:flex;flex-direction:column;gap:9px}
.prm label.l{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.prm .row{display:flex;align-items:center;gap:8px}
.prm input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.prm .numbox{width:68px;height:26px;border:1px solid var(--line);background:var(--raised);border-radius:5px;padding:0 6px;font:12px var(--f-num)}
.prm select{width:100%;height:28px;border:1px solid var(--line);background:var(--raised);border-radius:5px;padding:0 6px}
.prm input[type=color]{width:34px;height:26px;padding:0 2px;border:1px solid var(--line);border-radius:5px;background:var(--raised);cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{position:relative}
.sw .x{position:absolute;right:-6px;top:-6px;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font-size:10px;line-height:12px;padding:0;cursor:pointer;color:var(--muted)}
.iact{display:flex;gap:6px}

/* 모달 */
.mback{position:fixed;inset:0;background:rgba(8,10,16,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal h3{margin:0;font-size:16px;font-weight:600}
.modal p{margin:0;color:var(--muted);font-size:12.5px}
.modal textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:10px;font:12px/1.5 var(--f-num)}
.modal textarea.tall{min-height:260px}
.modal .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modal .err{color:var(--danger);font-size:12.5px;white-space:pre-line}
.modal .warn{color:var(--muted);font-size:12px;white-space:pre-line}
.sheet-view{overflow:auto;max-height:340px;border-radius:8px;padding:8px}
.sheet-view img{image-rendering:pixelated;display:block;max-width:none}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:900px){
  html,body{height:auto}
  #app{height:auto;grid-template-rows:auto auto}
  .work{grid-template-columns:minmax(0,1fr)}
  #graph{height:62vh;min-height:380px}
  .side{overflow:visible}
  .actions{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <a class="brand" href="/" title="Ryu Seo Jin 블로그로 돌아가기">
      <svg viewBox="0 0 7 7" aria-hidden="true"><g fill="var(--accent)"><rect x="3" y="0" width="1" height="2"/><rect x="3" y="5" width="1" height="2"/><rect x="0" y="3" width="2" height="1"/><rect x="5" y="3" width="2" height="1"/><rect x="2" y="2" width="3" height="3"/></g><rect x="3" y="3" width="1" height="1" fill="var(--bg)"/></svg>
      <div><b>도트 이펙트 작업대</b><br><small>← RYUSEOJIN.COM</small></div>
    </a>
    <div class="fields">
      <label class="fld" for="name">이름 <input id="name" class="inp" maxlength="60"></label>
      <label class="fld" for="kind">유형 <select id="kind" class="sel"></select></label>
      <label class="fld" for="size">캔버스 <select id="size" class="sel"></select></label>
      <label class="fld" for="cw">가로 <input id="cw" class="inp num" type="number" min="8" max="256"></label>
      <label class="fld" for="ch">세로 <input id="ch" class="inp num" type="number" min="8" max="256"></label>
      <label class="fld" for="frames">프레임 <input id="frames" class="inp num" type="number" min="1" max="96"></label>
      <label class="fld" for="fps">FPS <input id="fps" class="inp num" type="number" min="1" max="60"></label>
      <label class="chk" for="loop"><input id="loop" type="checkbox"> 반복 재생</label>
      <label class="chk" for="emptyTail" title="반복 재생이 아닐 때 마지막 프레임을 비웁니다"><input id="emptyTail" type="checkbox"> 마지막 프레임 비우기</label>
    </div>
    <div class="actions">
      <select id="preset" class="sel" aria-label="예제 불러오기">
        <option value="">예제 불러오기…</option>
      </select>
      <button class="btn" id="btnImport">JSON 불러오기</button>
      <button class="btn" id="btnJson">JSON 내보내기</button>
      <button class="btn" id="btnPng">PNG 시트</button>
      <button class="btn primary" id="btnPrompt">AI 프롬프트</button>
    </div>
  </header>

  <main class="work">
    <section id="graph" aria-label="노드뷰">
      <div id="world">
        <svg id="wires"><g transform="translate(20000,20000)"></g></svg>
        <div id="nodes"></div>
      </div>
      <div class="gtools">
        <button class="btn sm" id="btnAdd">+ 노드 추가</button>
        <button class="btn sm" id="btnFit">화면 맞춤</button>
        <button class="btn sm" id="btnLayout">자동 정렬</button>
        <button class="btn sm" id="btnUndo" title="Ctrl+Z">되돌리기</button>
      </div>
      <div class="ghint">빈 곳 드래그: 화면 이동 · 휠: 확대 · 더블클릭: 노드 추가 · 출력 점을 끌어 입력 점에 연결 · 선 클릭: 연결 끊기</div>
      <div class="menu" id="menu" hidden></div>
    </section>

    <aside class="side">
      <section class="card" aria-label="미리보기">
        <div class="card-h">
          <h2>미리보기</h2>
          <div class="seg" id="bgSeg" role="group" aria-label="배경">
            <button data-bg="checker" aria-pressed="true">격자</button><button data-bg="dark" aria-pressed="false">어둡게</button><button data-bg="light" aria-pressed="false">밝게</button>
          </div>
        </div>
        <div class="stage bg-checker" id="stage"><div class="cv-wrap"><canvas id="view"></canvas><div id="pivotMark" title="기준점"></div></div></div>
        <div class="transport">
          <button class="btn icon" id="bPrev" aria-label="이전 프레임"><svg viewBox="0 0 16 16"><path d="M4 3h2v10H4zM13 3v10L7 8z"/></svg></button>
          <button class="btn icon" id="bPlay" aria-label="재생/일시정지"><svg viewBox="0 0 16 16" id="playIco"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
          <button class="btn icon" id="bNext" aria-label="다음 프레임"><svg viewBox="0 0 16 16"><path d="M10 3h2v10h-2zM3 3v10l6-5z"/></svg></button>
          <input type="range" id="scrub" min="0" value="0" aria-label="프레임 위치">
          <span class="fcount" id="fcount">01/24</span>
        </div>
        <div class="strip-wrap"><div class="strip-in"><canvas id="strip"></canvas><div id="stripCur"></div></div></div>
        <div class="meta" id="meta"></div>
        <div class="pivot-row">
          <label class="fld" for="pvx">기준점 X <input id="pvx" class="inp num" type="number" min="0" max="1" step="0.01"></label>
          <label class="fld" for="pvy">Y <input id="pvy" class="inp num" type="number" min="0" max="1" step="0.01"></label>
          <label class="fld" for="gsize" title="게임 화면에서 이 이펙트를 그릴 크기(px)">게임 크기 <input id="gsize" class="inp num" type="number" min="8" max="320"></label>
          <label class="chk" for="showPivot"><input id="showPivot" type="checkbox" checked> 기준점 표시</label>
        </div>
      </section>
      <section class="card" aria-label="규칙 점검">
        <div class="card-h"><h2>규칙 점검</h2><span class="meta" id="ruleSum"></span></div>
        <ul class="rules" id="rules"></ul>
      </section>
      <section class="card" aria-label="노드 속성">
        <div class="card-h"><h2>속성</h2></div>
        <div id="insp"></div>
      </section>
    </aside>
  </main>
</div>
<div class="mback" id="mback" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const DEG=Math.PI/180;

function plot(f,x,y,v){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;if(v>f.d[i])f.d[i]=v;}
function rectC(f,cx,cy,w,h,v){w=Math.max(1,Math.round(w));h=Math.max(1,Math.round(h));const x0=Math.round(cx-w/2),y0=Math.round(cy-h/2);
  for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)plot(f,x,y,v);}
function disc(f,cx,cy,r,v){if(r<.75){plot(f,cx,cy,v);return;}
  for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){const dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy<=r*r)plot(f,x,y,v);}}
function dseg(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,L=vx*vx+vy*vy;let u=L?(wx*vx+wy*vy)/L:0;u=u<0?0:u>1?1:u;const dx=wx-u*vx,dy=wy-u*vy;return Math.sqrt(dx*dx+dy*dy);}
function seg(f,ax,ay,bx,by,w,v){const r=Math.max(.71,w/2);
  for(let y=Math.floor(Math.min(ay,by)-r);y<=Math.ceil(Math.max(ay,by)+r);y++)for(let x=Math.floor(Math.min(ax,bx)-r);x<=Math.ceil(Math.max(ax,bx)+r);x++)
    if(dseg(x+.5,y+.5,ax,ay,bx,by)<=r)plot(f,x,y,v);}
function hash2(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y,P,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const m=k=>((k%P)+P)%P,y0=m(yi),y1=m(yi+1);const a=hash2(xi,y0,s),b=hash2(xi+1,y0,s),c=hash2(xi,y1,s),d=hash2(xi+1,y1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function hexRGB(h){h=String(h||'#ffffff').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
function colorize(b,colors,cut,gamma){const out=newC();const pal=colors.map(hexRGB),n=pal.length;
  for(let i=0;i<N;i++){let v=b.k==='f'?b.d[i]:Math.max(b.d[i*4],b.d[i*4+1],b.d[i*4+2])*b.d[i*4+3];if(v<=cut)continue;

  return out;}

ring:{label:'충격파',cat:'gen',desc:'중심에서 퍼져 나가는 고리. 세로 비율을 낮추면 바닥 파동이 됩니다.',inputs:[],

flame:{label:'불꽃',cat:'gen',desc:'일렁이며 타오르는 불기둥. 반복 재생을 켜면 끊김 없이 이어집니다.',inputs:[],

mirror:{label:'대칭',cat:'mod',desc:'입력을 좌우·상하로 뒤집어 겹치거나, 원을 따라 여러 번 복제합니다.',inputs:['입력'],

trail:{label:'잔상',cat:'mod',desc:'조금 전 모습을 어둡게 겹칩니다. 색입히기 앞에 두면 어두운 색으로 꼬리가 남습니다.',inputs:['입력'],

const MENU_ORDER={gen:['ring','burst','slash','orb','rays','circle','rise','sparkle','flame'],mod:['time','transform','mirror','trail','dither'],col:['colorize','outline'],mix:['merge']};
const defaults=type=>Object.fromEntries(DEFS[type].params.map(p=>[p.k,Array.isArray(p.def)?[...p.def]:p.def]));

/* ───────── 문서 정리 · 자동 정렬 ───────── */
const clampInt=(v,a,b,d)=>{v=Math.round(Number(v));return Number.isFinite(v)?clamp(v,a,b):d;};
const isHex=s=>typeof s==='string'&&/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(s);
function coerce(pr,v){
  if(v===undefined||v===null)return Array.isArray(pr.def)?[...pr.def]:pr.def;
  switch(pr.type){
    case 'num':{const n=Number(v);return Number.isFinite(n)?clamp(n,pr.min,pr.max):pr.def;}
    case 'int':{const n=Math.round(Number(v));return Number.isFinite(n)?clamp(n,pr.min,pr.max):pr.def;}
    case 'sel':return pr.opts.some(o=>o[0]===v)?v:pr.def;
    case 'bool':return v===true||v==='true'||v===1;
    case 'color':return isHex(v)?v:pr.def;
    case 'colors':{const a=Array.isArray(v)?v.filter(isHex).slice(0,8):[];return a.length?a:[...pr.def];}
  }return pr.def;}
function normalizeDoc(raw){
  const warns=[];if(!raw||typeof raw!=='object'||!Array.isArray(raw.nodes))throw new Error('"nodes" 배열을 찾지 못했어요. 이 도구에서 만든 형식의 JSON인지 확인해 주세요.');
  const num01=(v,d)=>{v=Number(v);return Number.isFinite(v)?clamp(v,0,1):d;};
  const d={format:'dotfx',version:2,name:String(raw.name||'이름 없는 이펙트').slice(0,60),kind:KINDS[raw.kind]?raw.kind:'',width:clampInt(raw.width,8,256,64),height:clampInt(raw.height??raw.width,8,256,64),
    frames:clampInt(raw.frames,1,96,24),fps:clampInt(raw.fps,1,60,12),loop:!!raw.loop,emptyTail:raw.emptyTail!==false,
    pivotX:num01(raw.pivotX,.5),pivotY:num01(raw.pivotY,.5),gameSize:0,nodes:[]};
  d.gameSize=clampInt(raw.gameSize,8,320,Math.max(d.width,d.height));
  const rename=new Map(),used=new Set();let auto=1;
  const fresh=()=>{while(used.has('n'+auto))auto++;return 'n'+auto;};
  let hasOut=false,needLayout=false;
  for(const rn of raw.nodes){
    if(!rn||!DEFS[rn.type]){warns.push(`알 수 없는 노드 종류 "${rn&&rn.type}"는 건너뛰었어요.`);continue;}
    if(rn.type==='output'){if(hasOut){warns.push('출력 노드가 여러 개라 첫 번째만 남겼어요.');continue;}hasOut=true;}
    let id=String(rn.id??'');if(rn.type==='output')id='out';else if(!/^[\w-]{1,24}$/.test(id)||used.has(id)||id==='out')id=fresh();
    if(rn.id!==undefined)rename.set(String(rn.id),id);used.add(id);
    const def=DEFS[rn.type],params={};for(const pr of def.params)params[pr.k]=coerce(pr,rn.params?.[pr.k]);
    const x=Number(rn.x),y=Number(rn.y);if(!Number.isFinite(x)||!Number.isFinite(y))needLayout=true;
    d.nodes.push({id,type:rn.type,x:Number.isFinite(x)?x:0,y:Number.isFinite(y)?y:0,params,in:def.inputs.map((_,i)=>Array.isArray(rn.in)?rn.in[i]??null:null)});
  }
  for(const n of d.nodes)n.in=n.in.map(s=>{if(s===null||s===undefined)return null;const id=rename.get(String(s));return id&&id!==n.id?id:null;});
  if(!hasOut){const last=d.nodes.filter(n=>n.type!=='output').pop();d.nodes.push({id:'out',type:'output',x:0,y:0,params:defaults('output'),in:[last?last.id:null]});needLayout=true;warns.push('출력 노드가 없어서 새로 만들었어요.');}
  // 순환 연결 제거
  for(const n of d.nodes)n.in=n.in.map(s=>s&&!dependsOn(d,s,n.id)?s:null);
  if(needLayout)autoLayout(d);
  return{doc:d,warns};}
function dependsOn(d,a,b){const m=new Map(d.nodes.map(n=>[n.id,n]));const seen=new Set();const st=[a];
  while(st.length){const id=st.pop();if(id===b)return true;if(seen.has(id))continue;seen.add(id);const n=m.get(id);if(n)for(const s of n.in)if(s)st.push(s);}return false;}
function autoLayout(d){const m=new Map(d.nodes.map(n=>[n.id,n])),colOf=new Map();
  const depth=(id,stk=new Set())=>{if(colOf.has(id))return colOf.get(id);if(stk.has(id))return 0;stk.add(id);const n=m.get(id);let c=0;for(const s of n.in)if(s&&m.has(s))c=Math.max(c,depth(s,stk)+1);colOf.set(id,c);return c;};
  d.nodes.forEach(n=>depth(n.id));const cols=[];d.nodes.forEach(n=>{const c=colOf.get(n.id);(cols[c]=cols[c]||[]).push(n);});
  cols.forEach((list,c)=>{if(!list)return;list.forEach((n,i)=>{const ys=n.in.filter(s=>s&&m.has(s)).map(s=>m.get(s).y);n._d=c===0||!ys.length?40+i*250:ys.reduce((a,b)=>a+b,0)/ys.length;});
    list.sort((a,b)=>a._d-b._d);let prev=-1e9;list.forEach(n=>{n.y=Math.max(n._d,prev+250);prev=n.y;n.x=40+c*230;delete n._d;});});}

function evalNode(id,t,cache){const key=id+'@'+t.toFixed(5);if(cache.has(key))return cache.get(key);cache.set(key,null);
  const n=IDX.get(id);if(!n)return null;const def=DEFS[n.type];
  const ev=(i,tt)=>{const s=n.in[i];return s?evalNode(s,clamp(tt,0,1),cache):null;};
  let r=null;try{r=def.fn(n.params,t,ev);}catch(e){console.error(e);}cache.set(key,r);return r;}
function prep(){setSize(doc.width,doc.height);IDX=new Map(doc.nodes.map(n=>[n.id,n]));}
function bufToImage(ctx,buf){const im=ctx.createImageData(W,H),D=im.data;if(!buf)return im;
  if(buf.k==='f'){for(let i=0;i<N;i++){const v=buf.d[i];if(v>0){D[i*4]=D[i*4+1]=D[i*4+2]=255;D[i*4+3]=Math.round(255*Math.min(1,v));}}}
  else{for(let i=0;i<N;i++){const a=buf.d[i*4+3];if(a>0){D[i*4]=Math.round(buf.d[i*4]*255);D[i*4+1]=Math.round(buf.d[i*4+1]*255);D[i*4+2]=Math.round(buf.d[i*4+2]*255);D[i*4+3]=Math.round(255*Math.min(1,a));}}}
  return im;}

function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`;gp.style.backgroundSize=`${20*view.z}px ${20*view.z}px`;gp.style.backgroundPosition=`${view.x}px ${view.y}px`;}
function toWorld(cx,cy){const r=gp.getBoundingClientRect();return{x:(cx-r.left-view.x)/view.z,y:(cy-r.top-view.y)/view.z};}
function portPos(el){const r=el.getBoundingClientRect();return toWorld(r.left+r.width/2,r.top+r.height/2);}
const wirePath=(a,b)=>{const dx=Math.max(40,Math.abs(b.x-a.x)*.5);return`M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`;};

function renderNodes(){
  const used=new Set();doc.nodes.forEach(n=>n.in.forEach(s=>s&&used.add(s)));
  nodesEl.innerHTML=doc.nodes.map(n=>{const d=DEFS[n.type];return`<div class="node${n.id===selected?' sel':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px">
    <div class="nhead"><span class="ncat c-${d.cat}">${CATS[d.cat]}</span><span class="ntitle">${d.label}</span><span class="nid">${n.id}</span></div>
    <canvas class="nthumb" width="${doc.width}" height="${doc.height}"></canvas>
    <div class="nports"><div class="ins">${d.inputs.map((l,i)=>`<div class="port in${n.in[i]?' on':''}" data-id="${n.id}" data-i="${i}"><i></i><span>${l}</span></div>`).join('')}</div>
    ${n.type==='output'?'':`<div class="port out${used.has(n.id)?' on':''}" data-id="${n.id}"><span>출력</span><i></i></div>`}</div></div>`;}).join('');
  thumbs=new Map($$('.node',nodesEl).map(el=>[el.dataset.id,el.querySelector('canvas').getContext('2d')]));

function renderWires(){const outs=new Map();$$('.port.out',nodesEl).forEach(p=>outs.set(p.dataset.id,portPos(p.querySelector('i'))));let h='';
  $$('.port.in',nodesEl).forEach(p=>{const n=byId(p.dataset.id),src=n&&n.in[+p.dataset.i];if(!src||!outs.has(src))return;
    const a=outs.get(src),b=portPos(p.querySelector('i')),cat=DEFS[byId(src).type].cat,d=wirePath(a,b);
    h+=`<g class="link" data-to="${n.id}" data-i="${p.dataset.i}"><path class="wire w-${cat}" d="${d}"/><path class="hit" d="${d}"><title>클릭하면 연결을 끊어요</title></path></g>`;});
  if(tmpWire)h+=`<path class="wire tmp" d="${wirePath(tmpWire.a,tmpWire.b)}"/>`;wiresG.innerHTML=h;}

const fmt=(pr,v)=>pr.type==='int'?String(v):String(Math.round(v*1000)/1000);
function prmHTML(pr,v){const id='p-'+pr.k;
  switch(pr.type){
   case 'num':case 'int':return`<div class="prm"><label class="l" for="${id}">${pr.label}</label><div class="row"><input type="range" id="${id}" data-k="${pr.k}" min="${pr.min}" max="${pr.max}" step="${pr.step}" value="${v}"><input class="numbox" type="number" data-k="${pr.k}" min="${pr.min}" max="${pr.max}" step="${pr.step}" value="${fmt(pr,v)}" aria-label="${pr.label} 값"></div></div>`;
   case 'sel':return`<div class="prm"><label class="l" for="${id}">${pr.label}</label><select id="${id}" data-k="${pr.k}">${pr.opts.map(o=>`<option value="${o[0]}"${o[0]===v?' selected':''}>${o[1]}</option>`).join('')}</select></div>`;
   case 'bool':return`<div class="prm"><label class="chk" for="${id}"><input type="checkbox" id="${id}" data-k="${pr.k}"${v?' checked':''}> ${pr.label}</label></div>`;
   case 'color':return`<div class="prm"><label class="l" for="${id}">${pr.label}</label><div class="row"><input type="color" id="${id}" data-k="${pr.k}" value="${v}"><code class="meta">${v}</code></div></div>`;
   case 'colors':return`<div class="prm"><span class="l" style="display:block;font-size:12px;color:var(--muted);margin-bottom:3px">${pr.label}</span><select class="palpick" data-pal="${pr.k}" aria-label="공식 팔레트 적용"><option value="">공식 팔레트 적용…</option>${PALETTES.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('')}</select><div class="swatches">${v.map((c,i)=>`<span class="sw"><input type="color" data-k="${pr.k}" data-ci="${i}" value="${c}" aria-label="${i+1}번째 색">${v.length>1?`<button class="x" data-act="rmc" data-k="${pr.k}" data-ci="${i}" aria-label="${i+1}번째 색 빼기">×</button>`:''}</span>`).join('')}${v.length<8?`<button class="btn sm" data-act="addc" data-k="${pr.k}">+ 색</button>`:''}</div></div>`;}}
function renderInspector(){const box=$('#insp'),n=selected&&byId(selected);
  if(!n){box.innerHTML=`<div class="empty">노드를 클릭하면 여기서 값을 바꿀 수 있어요.<br>노드를 선택한 채 새 노드를 추가하면 자동으로 이어 붙습니다.<br><kbd>Space</kbd> 재생 · <kbd>Del</kbd> 노드 삭제 · <kbd>Ctrl</kbd>+<kbd>D</kbd> 복제 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 되돌리기</div>`;return;}
  const d=DEFS[n.type];
  box.innerHTML=`<div class="prms"><div class="ihead"><span class="ncat c-${d.cat}">${CATS[d.cat]}</span><b>${d.label}</b><code>${n.id}</code></div><p class="idesc">${d.desc}</p>
   ${d.params.map(pr=>prmHTML(pr,n.params[pr.k])).join('')}
   ${n.type==='output'?'':`<div class="iact"><button class="btn sm" data-act="dup">복제</button><button class="btn sm danger" data-act="del">삭제</button></div>`}</div>`;}
const insp=$('#insp');
insp.addEventListener('input',e=>{const el=e.target,k=el.dataset.k;if(!k)return;const n=byId(selected);if(!n)return;const pr=DEFS[n.type].params.find(p=>p.k===k);
  if(pr.type==='num'||pr.type==='int'){let v=parseFloat(el.value);if(!Number.isFinite(v))return;if(pr.type==='int')v=Math.round(v);v=clamp(v,pr.min,pr.max);n.params[k]=v;
    $$(`[data-k="${k}"]`,insp).forEach(o=>{if(o!==el)o.value=o.type==='range'?v:fmt(pr,v);});}
  else if(pr.type==='colors')n.params[k][+el.dataset.ci]=el.value;
  else if(pr.type==='color'){n.params[k]=el.value;const c=el.parentElement.querySelector('code');if(c)c.textContent=el.value;}
  else if(pr.type==='bool')n.params[k]=el.checked;else n.params[k]=el.value;
  markDirty();});
insp.addEventListener('change',e=>{const pk=e.target.closest('.palpick');
  if(pk){const n=byId(selected);if(n&&PAL[pk.value]){n.params[pk.dataset.pal]=[...PAL[pk.value]];renderInspector();markDirty();}else return;}
  commit();});
insp.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const n=byId(selected);if(!n)return;const act=b.dataset.act;
  if(act==='addc'){const a=n.params[b.dataset.k];a.push(a[a.length-1]||'#ffffff');}
  else if(act==='rmc'){n.params[b.dataset.k].splice(+b.dataset.ci,1);}
  else if(act==='dup'){duplicate(n);return;}else if(act==='del'){removeNode(n.id);return;}
  renderInspector();markDirty();commit();});

/* 노드 조작 */
function newId(){let i=1;while(byId('n'+i))i++;return 'n'+i;}
function addNode(type,x,y){const def=DEFS[type],n={id:newId(),type,x:Math.round(x/10)*10,y:Math.round(y/10)*10,params:defaults(type),in:def.inputs.map(()=>null)};
  const s=selected&&byId(selected);
  if(s&&def.inputs.length&&s.type!=='output'){n.in[0]=s.id;n.x=s.x+230;n.y=s.y;}
  doc.nodes.push(n);selected=n.id;renderNodes();renderInspector();markDirty();commit();}
function duplicate(n){const c=JSON.parse(JSON.stringify(n));c.id=newId();c.x+=30;c.y+=30;doc.nodes.push(c);selected=c.id;renderNodes();renderInspector();markDirty();commit();}
function removeNode(id){if(id==='out'){toast('출력 노드는 지울 수 없어요');return;}doc.nodes=doc.nodes.filter(n=>n.id!==id);doc.nodes.forEach(n=>n.in=n.in.map(s=>s===id?null:s));
  if(selected===id)selected=null;renderNodes();renderInspector();markDirty();commit();}
function connect(src,dst,i){const n=byId(dst);if(!n)return false;if(src===dst||dependsOn(doc,src,dst)){toast('순환 연결은 만들 수 없어요');return false;}n.in[i]=src;return true;}

function track(e,move,up){gp.setPointerCapture(e.pointerId);const mv=ev=>move(ev);const end=ev=>{gp.removeEventListener('pointermove',mv);gp.removeEventListener('pointerup',end);gp.removeEventListener('pointercancel',end);up(ev);};
  gp.addEventListener('pointermove',mv);gp.addEventListener('pointerup',end);gp.addEventListener('pointercancel',end);}
function startWire(src,e){const a=portPos($(`.port.out[data-id="${src}"] i`,nodesEl));tmpWire={a,b:toWorld(e.clientX,e.clientY)};renderWires();let hoverNode=null;
  track(e,ev=>{tmpWire.b=toWorld(ev.clientX,ev.clientY);renderWires();const el=document.elementFromPoint(ev.clientX,ev.clientY),nn=el&&el.closest('.node');
     if(hoverNode&&hoverNode!==nn)hoverNode.classList.remove('drop');hoverNode=nn&&nn.dataset.id!==src?nn:null;if(hoverNode)hoverNode.classList.add('drop');},
   ev=>{if(hoverNode)hoverNode.classList.remove('drop');tmpWire=null;const el=document.elementFromPoint(ev.clientX,ev.clientY);let port=el&&el.closest('.port.in');
     if(!port){const nn=el&&el.closest('.node');if(nn){const tn=byId(nn.dataset.id);if(tn&&tn.id!==src){const free=tn.in.findIndex(s=>!s);if(DEFS[tn.type].inputs.length)port=$(`.port.in[data-id="${tn.id}"][data-i="${free<0?0:free}"]`,nodesEl);}}}
     if(port)connect(src,port.dataset.id,+port.dataset.i);renderNodes();markDirty();commit();});}
gp.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(e.target.closest('.gtools,.menu'))return;if(!menu.hidden&&!e.target.closest('.menu'))menu.hidden=true;
  const dot=e.target.closest('.port i');
  if(dot){e.preventDefault();const port=dot.parentElement;
    if(port.classList.contains('out')){startWire(port.dataset.id,e);return;}
    const n=byId(port.dataset.id),i=+port.dataset.i;if(n.in[i]){const src=n.in[i];n.in[i]=null;renderNodes();startWire(src,e);}return;}
  const nodeEl=e.target.closest('.node');
  if(nodeEl){const id=nodeEl.dataset.id;if(selected!==id)select(id);if(e.target.closest('.nhead')){const n=byId(id),sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y;let moved=false;
      track(e,ev=>{const dx=(ev.clientX-sx)/view.z,dy=(ev.clientY-sy)/view.z;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(!moved)return;
        n.x=Math.round((ox+dx)/10)*10;n.y=Math.round((oy+dy)/10)*10;nodeEl.style.left=n.x+'px';nodeEl.style.top=n.y+'px';renderWires();},()=>{if(moved)commit();});}
    return;}
  if(e.target.closest('.hit'))return;
  const sx=e.clientX,sy=e.clientY,vx=view.x,vy=view.y;let moved=false;gp.classList.add('panning');
  track(e,ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>3)moved=viewTouched=true;view.x=vx+dx;view.y=vy+dy;applyView();},
   ()=>{gp.classList.remove('panning');if(!moved&&selected)select(null);});});
gp.addEventListener('click',e=>{const l=e.target.closest('.link');if(!l)return;const n=byId(l.dataset.to);if(n){n.in[+l.dataset.i]=null;renderNodes();markDirty();commit();}});
gp.addEventListener('dblclick',e=>{if(e.target.closest('.node,.gtools,.menu,.link'))return;openMenu(e.clientX,e.clientY,toWorld(e.clientX,e.clientY));});
gp.addEventListener('wheel',e=>{e.preventDefault();const r=gp.getBoundingClientRect(),w=toWorld(e.clientX,e.clientY);const z=clamp(view.z*Math.exp(-e.deltaY*.0015),.25,2);
  view.z=z;view.x=e.clientX-r.left-w.x*z;view.y=e.clientY-r.top-w.y*z;applyView();},{passive:false});

function fitView(){const r=gp.getBoundingClientRect();if(!doc.nodes.length||!r.width)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  $$('.node',nodesEl).forEach(el=>{const n=byId(el.dataset.id);x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+el.offsetWidth);y1=Math.max(y1,n.y+el.offsetHeight);});
  const z=clamp(Math.min((r.width-60)/(x1-x0),(r.height-110)/(y1-y0)),.35,1.1);view.z=z;view.x=(r.width-(x1-x0)*z)/2-x0*z;view.y=(r.height-(y1-y0)*z)/2-y0*z+6;applyView();}

let sheetT;
function markDirty(){needRender=true;clearTimeout(sheetT);sheetT=setTimeout(buildSheet,160);}
const isTailFrame=f=>doc.emptyTail&&!doc.loop&&doc.frames>1&&f===doc.frames-1;
function outAt(f,cache){return isTailFrame(f)?null:evalNode('out',tOf(f),cache);}
function buildSheet(){prep();sheet.width=W*doc.frames;sheet.height=H;
  for(let f=0;f<doc.frames;f++){const buf=outAt(f,new Map());shctx.putImageData(bufToImage(shctx,buf),f*W,0);}
  strip.width=sheet.width;strip.height=sheet.height;sctx.clearRect(0,0,strip.width,strip.height);sctx.drawImage(sheet,0,0);
  strip.style.width=(44*W/H*doc.frames)+'px';positionStripCur();
  checkRules(shctx.getImageData(0,0,sheet.width,sheet.height).data);
  $('#meta').textContent=`${W} × ${H}px · ${doc.frames}프레임 · ${doc.fps}fps · 길이 ${(doc.frames/doc.fps).toFixed(2)}초 · 게임에서 ${doc.gameSize}px (×${(doc.gameSize/Math.max(W,H)).toFixed(2)}) · 노드 ${doc.nodes.length}개`;}
function checkRules(D){const F=doc.frames,SW=W*F,cols=new Set(),px=new Array(F).fill(0);let minM=1e9;
  for(let f=0;f<F;f++)for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*SW+f*W+x)*4;if(!D[i+3])continue;px[f]++;cols.add(D[i]<<16|D[i+1]<<8|D[i+2]);minM=Math.min(minM,x,y,W-1-x,H-1-y);}
  const total=px.reduce((a,b)=>a+b,0),items=[],add=(lv,title,note)=>items.push({lv,title,note});
  if(!total)add('bad','출력이 비어 있어요','출력 노드에 그림이 연결되어 있는지 확인하세요.');
  else{
    const n=cols.size;add(n===5?'ok':n<5?'warn':'bad',`사용 색 ${n}개`,n===5?'공식 세트처럼 정확히 5색이에요.':n<5?'공식 세트는 5색을 써요. 색입히기 팔레트를 5단계로 맞춰 보세요.':'공식 세트는 이펙트 하나에 5색만 써요. 모든 레이어가 같은 팔레트를 쓰게 하고, 외곽선 노드는 빼세요.');
    add('ok','반투명 없음','출력 노드가 알파를 0 또는 255로 정리해요.');
    add(minM>=4?'ok':'warn',`가장자리 여백 ${minM}px`,minM>=4?'4px 이상 비어 있어요.':'공식 세트는 가장자리 4px 이상을 비워요. 크기나 위치를 줄여 보세요.');
    if(!doc.loop){const last=px[F-1];add(last===0?'ok':'warn',last===0?'마지막 프레임 비어 있음':'마지막 프레임에 그림이 남아 있어요',last===0?'다음 동작과 이어 붙이기 좋아요.':'"마지막 프레임 비우기"를 켜거나 사라지는 시점을 앞당기세요.');}
    const mx=Math.max(...px),half=px.findIndex(v=>v>=mx*.5)+1;
    add(half<=5?'ok':'warn',`${half}번째 프레임에 최대 크기의 50% 도달`,half<=5?'공식 세트처럼 5프레임 안에 크게 나타나요.':'공식 세트는 모두 5프레임 안에 50%에 도달해요. 등장을 더 빠르게 해 보세요.');
    if(doc.kind){const k=KINDS[doc.kind],pk=px.indexOf(mx)/Math.max(1,F-1),ok=pk>=k.peak[0]-.05&&pk<=k.peak[1]+.05;
      add(ok?'ok':'warn',`최고점 ${Math.round(pk*100)}% 지점 (유형 ${doc.kind}: ${Math.round(k.peak[0]*100)}~${Math.round(k.peak[1]*100)}%)`,k.desc);}
    else if(doc.loop)add('ok','반복 재생 이펙트','계속 이어지는 이펙트라 타이밍 유형 점검은 건너뛰어요.');
    else add('warn','유형이 정해지지 않았어요','상단 "유형"에서 A~E를 고르면 타이밍도 점검해요.');}
  $('#rules').innerHTML=items.map(it=>`<li><span class="pill ${it.lv}">${it.lv==='ok'?'통과':it.lv==='warn'?'확인':'문제'}</span><span>${it.title}</span><small>${it.note}</small></li>`).join('');
  const nb=items.filter(i=>i.lv!=='ok').length;$('#ruleSum').textContent=nb?`확인할 항목 ${nb}개`:'모두 통과';}
function positionStripCur(){if(!doc)return;const cw=strip.clientWidth/doc.frames,c=$('#stripCur');c.style.left=(frame*cw)+'px';c.style.width=cw+'px';

## 답변 형식
JSON 코드 블록 하나만 답하세요. 설명 글은 쓰지 마세요.

## JSON 구조
{ "format": "dotfx", "version": 2, "name": "이펙트 이름", "kind": "A~E", "width": ${doc.width}, "height": ${doc.height}, "frames": ${doc.frames}, "fps": ${doc.fps}, "loop": ${doc.loop},
  "emptyTail": true, "pivotX": ${doc.pivotX}, "pivotY": ${doc.pivotY}, "gameSize": ${doc.gameSize},
  "nodes": [ { "id": "n1", "type": "ring", "params": { ... }, "in": [] }, ... ] }

## 그래프 규칙
- 각 노드의 "in"은 입력 포트 순서대로 연결할 노드 id 배열입니다. 비어 있는 포트는 null로 둡니다.
- id가 "out"인 output 노드가 정확히 하나 있어야 하고, 최종 결과가 여기로 들어가야 합니다.
- params에서 기본값과 같은 항목은 생략해도 됩니다. 노드 화면 위치(x, y)도 생략하면 자동 정렬됩니다.
- 위치는 캔버스 대비 0~1 비율(0.5 = 가운데), 길이는 캔버스 짧은 변 대비 비율입니다. 각도는 도(°)이며 0°는 오른쪽, -90°는 위쪽입니다.
- 시간 값은 0(첫 프레임)~1(마지막 프레임) 진행도입니다.
- 생성 노드는 밝기(0~1) 흑백 결과를 냅니다. colorize로 팔레트를 입히세요.
- 여러 레이어는 merge로 겹칩니다. 레이어 1이 맨 아래입니다. 4개보다 많으면 merge를 이어 붙이세요.
- 사라지는 연출은 생성 노드의 fade, time 노드의 end, dither 노드를 쓰세요.
- pivotX/pivotY는 게임에서 이펙트를 붙일 기준점(0~1), gameSize는 게임 화면에서 그릴 크기(px)입니다.

## 그림 규칙 (공식 세트 측정 기준, 반드시 지킬 것)
- 이펙트 전체에 정확히 5색만 씁니다. 모든 colorize 노드는 같은 공식 팔레트 하나를 쓰세요(일부 단계만 써도 됨).
- 반투명과 안티앨리어싱은 쓰지 않습니다. outline(검은 외곽선) 노드는 쓰지 마세요. 가장 어두운 팔레트 색이 테두리 역할을 합니다.
- 화면 비중은 어두운 색이 가장 넓고(35~65%), 가장 밝은 색은 5% 이하의 코어·하이라이트에만 씁니다.
- 가장자리 4px 이상은 비웁니다. 최대 크기는 56px 정도입니다.
- 위치: 타격·폭발은 가운데(0.5, 0.5), 바닥 마법·버프·힐·먼지는 y 0.64~0.73에 세로 비율(sy) 약 0.45의 납작한 타원, 화염은 y 0.55~0.65, 휘두르기는 y 0.3~0.4.
- 최대 크기 기준(64px 캔버스): 먼지 13×6, 찌르기 32×8, 화염 28×31, 타격 28~50, 바닥 마법 50×24, 폭발 56×53.
- 모든 이펙트는 2~5번째 프레임 안에 최대 크기의 50%에 도달해야 합니다. 천천히 나타나지 않습니다.
- 반복 재생이 아니면 마지막 프레임은 비어 있어야 합니다(emptyTail: true).

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!mback.hidden)closeModal();else if(!menu.hidden)menu.hidden=true;return;}
  if(!mback.hidden)return;const tg=e.target;if(tg.closest&&tg.closest('input,textarea,select'))return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();}
  else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo();}
  else if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();const n=selected&&byId(selected);if(n&&n.type!=='output')duplicate(n);}
  else if((e.key==='Delete'||e.key==='Backspace')&&selected){e.preventDefault();removeNode(selected);}
  else if(e.key===' '&&!tg.closest('button')){e.preventDefault();setPlaying(!playing);}
  else if(e.key==='ArrowRight'&&!mod){setPlaying(false);setFrame((frame+1)%doc.frames);}
  else if(e.key==='ArrowLeft'&&!mod){setPlaying(false);setFrame((frame-1+doc.frames)%doc.frames);}});
